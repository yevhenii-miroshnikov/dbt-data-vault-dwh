
# Project identity and dbt profile used by this repository.
name: 'dbt_with_datavault_demo'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_with_datavault_demo'

# Project resource locations.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# Layer defaults; individual model materializations override these where needed.
models:
  dbt_with_datavault_demo:
    l_00_brz:
      +schema: 'bronze_db'
      +materialized: view
      +tags:
        - 'medallion_bronze'
        - 'raw'
      +enabled: true
    l_10_stg:
      +schema: 'data_vault'
      +materialized: view
      +tags:
        - 'medallion_bronze'
        - 'stage'
      +enabled: true
    l_20_data_vault:
      +schema: 'data_vault'
      +materialized: table
      +tags:
        - 'medallion_silver'
        - 'raw_vault'
      +enabled: true
      hub_order:
        +materialized: incremental
      hub_pizza:
        +materialized: incremental
      lnk_order_pizza:
        +materialized: incremental
      sat_order:
        +materialized: incremental
      sat_pizza:
        +materialized: incremental
      sat_order_pizza:
        +materialized: incremental
      ref_pizza_type:
        +materialized: table
    l_30_data_marts:
      +schema: 'data_marts'
      +materialized: view
      +tags:
        - 'medallion_gold'
        - 'marts'
      +enabled: true

seeds:
  dbt_with_datavault_demo:
    meta:
      +schema: 'bronze_db'
      +quote_columns: true
      +delimiter: ','
    data:
      +schema: 'bronze_db'
      +quote_columns: true
      +delimiter: ','
